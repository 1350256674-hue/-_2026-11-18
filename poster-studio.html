<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>视频封面制作</title><body style="background:#111;color:#eee;padding:30px;font-family:sans-serif"><h1>视频封面制作</h1><button id="start">生成七个视频封面</button><p id="status">等待开始</p><video muted preload="metadata" style="width:600px;max-width:100%"></video><canvas hidden></canvas><script type="module">
import groups from '/src/works.json';
const status=document.querySelector('#status'),video=document.querySelector('video'),canvas=document.querySelector('canvas');
const ready=(event)=>new Promise((resolve,reject)=>{const timer=setTimeout(()=>{cleanup();reject(Error('视频加载超时'))},25000);const ok=()=>{cleanup();resolve()},fail=()=>{cleanup();reject(Error(video.error?.message||'视频错误'))};function cleanup(){clearTimeout(timer);video.removeEventListener(event,ok);video.removeEventListener('error',fail);}video.addEventListener(event,ok,{once:true});video.addEventListener('error',fail,{once:true});});
document.querySelector('#start').onclick=async()=>{const report=[];document.querySelector('#start').disabled=true;try{for(const g of groups.filter(g=>g.kind==='video'))for(const item of g.items){status.textContent='正在制作 '+item.name;const metadata=ready('loadedmetadata');video.src=item.src;video.load();await metadata;const seek=ready('seeked');video.currentTime=Math.min(2,video.duration/8);await seek;canvas.width=Math.min(1200,video.videoWidth);canvas.height=Math.round(canvas.width*video.videoHeight/video.videoWidth);canvas.getContext('2d').drawImage(video,0,0,canvas.width,canvas.height);const blob=await new Promise(r=>canvas.toBlob(r,'image/jpeg',.88));const result=await fetch('/__workposter?name='+item.id+'-poster.jpg',{method:'POST',body:blob});if(!result.ok)throw Error('保存失败');report.push(item.name+' ✓ '+video.videoWidth+'×'+video.videoHeight+' / '+video.duration.toFixed(1)+'秒');}status.textContent='完成：'+report.join('；');}catch(e){status.textContent='失败：'+e.message+'；已完成：'+report.join('；')}finally{video.removeAttribute('src');video.load();document.querySelector('#start').disabled=false;}};
</script></body></html>
